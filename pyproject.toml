[project]
name = "tenexus"
version = "0.1.0"
description = "AI-assisted landlord-tenant maintenance management system"
readme = "README.md"
authors = [
    { name = "smb8456", email = "smb8456@psu.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
]

[project.scripts]
tenexus = "tenexus:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false
